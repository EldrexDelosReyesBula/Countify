<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Countify Lite - Advanced writing analytics tool with word count, character count, reading time and more" />
    <title>Countify+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="/logo/countify.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://countify.landecs.org/css/mdui.css">
    <link rel="stylesheet" href="https://countify.landecs.org/css/mdui.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://countify.landecs.org/css/main.css" />
    </script>
    <script src="fonts/language.js"></script>
    <link rel="manifest" href="/manifest.json" />
</head>
<style>
    @font-face {
        font-family: 'Material Icons';
        font-style: normal;
        font-weight: 400;
        src: url('/fonts/MaterialIcons-Regular.woff') format('woff2'),
            url('fonts/MaterialIcons-Regular.woff') format('woff');
    }

    .material-icons {
        font-family: 'Material Icons';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
    }

  :root {
  /* Colors - Light Theme */
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #8b5cf6;
  --secondary: #64748b;
  --secondary-dark: #475569;
  --secondary-light: #94a3b8;
  --background: #ffffff;
  --surface: #f8fafc;
  --surface-dark: #f1f5f9;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --error: #ef4444;
  --error-light: #fecaca;
  --success: #10b981;
  --warning: #f59e0b;
  --info: #3b82f6;
  
  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  
  /* Border Radius */
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-2xl: 1.5rem;
  
  /* Spacing */
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;
  
  /* Typography */
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.875rem;
  
  /* Transitions */
  --transition-fast: 0.15s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.5s ease;
}

[data-theme="dark"] {
  --background: #0f172a;
  --surface: #1e293b;
  --surface-dark: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --border: #334155;
  --border-light: #475569;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
}

/* Reset and Base Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background-color: var(--background);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
}

/* Text Size Classes */
body.text-small {
  font-size: 0.875rem;
}

body.text-large {
  font-size: 1.125rem;
}

/* Glass Effect */
.glass {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-lg);
}

[data-theme="dark"] .glass {
  background: rgba(30, 41, 59, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Layout */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.layout-container {
  display: flex;
  flex: 1;
  position: relative;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-md) var(--space-lg);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.header-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--primary);
  cursor: pointer;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

/* Drawer */
.drawer {
  position: fixed;
  top: 0;
  left: -300px;
  width: 300px;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  transition: var(--transition-normal);
  z-index: 1000;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.drawer-open {
  left: 0;
}

.drawer-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition-normal);
}

.drawer-overlay-visible {
  opacity: 1;
  visibility: visible;
}

.drawer-header {
  padding: var(--space-lg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.drawer-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--primary);
}

.drawer-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: var(--space-xs);
  border-radius: var(--radius-sm);
}

.drawer-section {
  padding: var(--space-lg) 0;
  border-bottom: 1px solid var(--border-light);
}

.drawer-section-title {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0 var(--space-lg) var(--space-sm);
}

.drawer-item {
  display: flex;
  align-items: center;
  padding: var(--space-md) var(--space-lg);
  color: var(--text-secondary);
  text-decoration: none;
  transition: var(--transition-fast);
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-size: var(--font-size-base);
}

.drawer-item:hover {
  background: var(--surface-dark);
  color: var(--text-primary);
}

.drawer-item.active {
  background: var(--primary-light);
  color: white;
}

.drawer-item-icon {
  margin-right: var(--space-md);
  font-size: 1.25rem;
}

.drawer-item-arrow {
  margin-left: auto;
  color: var(--text-muted);
}

/* Main Content */
.main-content {
  flex: 1;
  padding: var(--space-lg);
  overflow-y: auto;
  background: var(--background);
}

.page-title {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  margin-bottom: var(--space-xl);
  color: var(--text-primary);
}

/* Dashboard */
.dashboard-header {
  margin-bottom: var(--space-xl);
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--space-lg);
  margin-bottom: var(--space-xl);
}

/* Activity Cards */
.activity-card {
  padding: var(--space-lg);
  transition: var(--transition-normal);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.activity-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.activity-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}

.activity-card-title {
  font-size: var(--font-size-lg);
  font-weight: 600;
  color: var(--text-primary);
  margin-right: var(--space-md);
  line-height: 1.4;
}

.activity-card-actions {
  flex-shrink: 0;
}

.activity-card-preview {
  color: var(--text-secondary);
  font-size: var(--font-size-sm);
  line-height: 1.5;
  margin-bottom: var(--space-md);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.activity-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--font-size-sm);
  color: var(--text-muted);
}

.activity-card-wordcount {
  font-weight: 600;
  color: var(--primary);
}

/* Card Colors */
.card-color-1 {
  border-left: 4px solid #6366f1;
}

.card-color-2 {
  border-left: 4px solid #10b981;
}

.card-color-3 {
  border-left: 4px solid #f59e0b;
}

.card-color-4 {
  border-left: 4px solid #ef4444;
}

.card-color-5 {
  border-left: 4px solid #8b5cf6;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-lg);
  font-size: var(--font-size-base);
  font-weight: 500;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition-fast);
  text-decoration: none;
  position: relative;
  overflow: hidden;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-dark);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn-outline {
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-outline:hover:not(:disabled) {
  background: var(--surface-dark);
  border-color: var(--text-muted);
}

.btn-icon {
  padding: var(--space-sm);
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: var(--radius-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.btn-icon:hover:not(:disabled) {
  background: var(--surface-dark);
  color: var(--text-primary);
}

/* FAB */
.fab {
  position: fixed;
  bottom: var(--space-xl);
  right: var(--space-xl);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  z-index: 100;
  transition: var(--transition-normal);
}

.fab:hover {
  transform: scale(1.1);
  box-shadow: var(--shadow-xl);
}

/* Editor */
.editor-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--background);
  z-index: 1000;
  transform: translateX(100%);
  transition: var(--transition-normal);
  display: flex;
  flex-direction: column;
}

.editor-container-open {
  transform: translateX(0);
}

.editor-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-md) var(--space-lg);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.editor-header-left,
.editor-header-right {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.editor-back-btn {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-md);
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: var(--transition-fast);
}

.editor-back-btn:hover {
  background: var(--surface-dark);
}

.editor-actions {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.undo-redo-container {
  display: flex;
  gap: var(--space-xs);
  margin-right: var(--space-md);
}

.undo-redo-btn {
  padding: var(--space-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition-fast);
}

.undo-redo-btn:hover:not(:disabled) {
  background: var(--surface-dark);
  color: var(--text-primary);
}

.undo-redo-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.editor-title {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  border: none;
  background: none;
  color: var(--text-primary);
  width: 100%;
  text-align: center;
  padding: var(--space-md);
}

.editor-title:focus {
  outline: none;
  background: var(--surface-dark);
  border-radius: var(--radius-md);
}

.editor-content-container {
  flex: 1;
  display: flex;
  padding: var(--space-lg);
  gap: var(--space-lg);
  overflow: hidden;
}

.editor-analytics {
  width: 300px;
  padding: var(--space-lg);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
  align-content: start;
  transition: var(--transition-normal);
  overflow-y: auto;
  max-height: 100%;
}

.editor-analytics.collapsed {
  width: 0;
  padding: 0;
  opacity: 0;
  visibility: hidden;
}

.analytics-item {
  text-align: center;
  padding: var(--space-md);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.analytics-value {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--primary);
  margin-bottom: var(--space-xs);
}

.analytics-label {
  font-size: var(--font-size-sm);
  color: var(--text-muted);
}

.editor-content {
  flex: 1;
  border: none;
  background: var(--surface);
  color: var(--text-primary);
  font-size: var(--font-size-base);
  line-height: 1.6;
  padding: var(--space-lg);
  border-radius: var(--radius-lg);
  resize: none;
  font-family: inherit;
  transition: var(--transition-normal);
}

.editor-content:focus {
  outline: none;
  box-shadow: 0 0 0 2px var(--primary-light);
}

.editor-footer {
  padding: var(--space-md) var(--space-lg);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Editor Options Menu */
.editor-options-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  z-index: 1100;
  min-width: 200px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: var(--transition-fast);
}

.editor-options-menu.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.editor-option-item {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-md) var(--space-lg);
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--transition-fast);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-size: var(--font-size-base);
}

.editor-option-item:hover {
  background: var(--surface-dark);
}

.editor-option-item.danger {
  color: var(--error);
}

.editor-option-item.danger:hover {
  background: var(--error-light);
}

/* Writing History */
.history-container {
  max-width: 1200px;
  margin: 0 auto;
}

.history-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-xl);
  align-items: start;
}

.history-chart-section,
.history-stats-section,
.recent-activities-section {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: var(--space-xl);
}

.history-chart-section {
  grid-column: 1 / -1;
}

.section-title {
  font-size: var(--font-size-lg);
  font-weight: 600;
  margin-bottom: var(--space-lg);
  color: var(--text-primary);
}

.history-graph {
  display: flex;
  align-items: end;
  justify-content: space-between;
  height: 200px;
  padding: var(--space-lg) 0;
  gap: var(--space-md);
}

.history-bar {
  flex: 1;
  background: linear-gradient(to top, var(--primary), var(--primary-light));
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  position: relative;
  transition: var(--transition-normal);
  min-height: 20px;
  display: flex;
  align-items: end;
  justify-content: center;
}

.history-bar:hover {
  opacity: 0.8;
  transform: scaleY(1.05);
}

.history-date {
  position: absolute;
  bottom: -25px;
  font-size: var(--font-size-sm);
  color: var(--text-muted);
  white-space: nowrap;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-lg);
}

.stat-card {
  padding: var(--space-lg);
  text-align: center;
  transition: var(--transition-normal);
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.stat-icon {
  font-size: 2rem;
  color: var(--primary);
  margin-bottom: var(--space-md);
}

.stat-value {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: var(--space-xs);
}

.stat-label {
  font-size: var(--font-size-sm);
  color: var(--text-muted);
}

.recent-activities-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.recent-activity-item {
  padding: var(--space-lg);
  transition: var(--transition-fast);
  cursor: pointer;
}

.recent-activity-item:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-md);
}

.recent-activity-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--space-sm);
}

.recent-activity-title {
  font-size: var(--font-size-base);
  font-weight: 600;
  color: var(--text-primary);
}

.recent-activity-date {
  font-size: var(--font-size-sm);
  color: var(--text-muted);
  white-space: nowrap;
}

.recent-activity-preview {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  line-height: 1.4;
  margin-bottom: var(--space-sm);
}

.recent-activity-meta {
  display: flex;
  gap: var(--space-lg);
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

/* Search */
.fullscreen-search {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--background);
  z-index: 2000;
  transform: translateY(-100%);
  transition: var(--transition-normal);
  display: flex;
  flex-direction: column;
}

.fullscreen-search.open {
  transform: translateY(0);
}

.search-header {
  display: flex;
  align-items: center;
  padding: var(--space-lg);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: var(--space-md);
}

.search-input-container {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--surface-dark);
  border-radius: var(--radius-lg);
  padding: var(--space-md) var(--space-lg);
  gap: var(--space-md);
}

.search-input-container input {
  flex: 1;
  border: none;
  background: none;
  color: var(--text-primary);
  font-size: var(--font-size-lg);
  outline: none;
}

.search-results-section {
  flex: 1;
  padding: var(--space-xl);
  overflow-y: auto;
}

.search-section-title {
  font-size: var(--font-size-lg);
  font-weight: 600;
  margin-bottom: var(--space-lg);
  color: var(--text-primary);
}

.search-results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--space-lg);
}

.search-result-card {
  padding: var(--space-lg);
  cursor: pointer;
  transition: var(--transition-normal);
}

.search-result-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.search-result-title {
  font-size: var(--font-size-base);
  font-weight: 600;
  margin-bottom: var(--space-sm);
  color: var(--text-primary);
}

.search-result-preview {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  line-height: 1.4;
  margin-bottom: var(--space-md);
}

.search-result-meta {
  display: flex;
  justify-content: space-between;
  font-size: var(--font-size-sm);
  color: var(--text-muted);
}

.search-results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-xl);
}

.search-results-count {
  font-size: var(--font-size-base);
  color: var(--text-secondary);
}

.search-query {
  font-weight: 600;
  color: var(--primary);
}

.empty-search-state {
  text-align: center;
  padding: var(--space-2xl);
  color: var(--text-muted);
}

.empty-search-state .material-icons {
  font-size: 3rem;
  margin-bottom: var(--space-md);
}

/* Modals */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition-normal);
}

.modal-open {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  max-width: 400px;
  width: 90%;
  padding: var(--space-xl);
  border-radius: var(--radius-xl);
}

.modal-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
  margin-bottom: var(--space-md);
  color: var(--text-primary);
}

.modal-message {
  color: var(--text-secondary);
  margin-bottom: var(--space-xl);
  line-height: 1.6;
}

.modal-actions {
  display: flex;
  gap: var(--space-md);
  justify-content: flex-end;
}

/* Context Menu */
.context-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  z-index: 2000;
  min-width: 200px;
  opacity: 0;
  visibility: hidden;
  transform: scale(0.95);
  transition: var(--transition-fast);
}

.context-menu-open {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}

.context-menu-item {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-md) var(--space-lg);
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--transition-fast);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-size: var(--font-size-base);
}

.context-menu-item:hover {
  background: var(--surface-dark);
}

.context-menu-item.danger {
  color: var(--error);
}

.context-menu-item.danger:hover {
  background: var(--error-light);
}

/* WATT Banner */
.watt-banner {
  position: fixed;
  bottom: var(--space-xl);
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  max-width: 500px;
  width: 90%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: var(--space-xl);
  box-shadow: var(--shadow-xl);
  z-index: 4000;
  transition: var(--transition-normal);
}

.watt-banner.show {
  transform: translateX(-50%) translateY(0);
}

.watt-content {
  margin-bottom: var(--space-lg);
}

.watt-title {
  font-size: var(--font-size-lg);
  font-weight: 700;
  margin-bottom: var(--space-sm);
  color: var(--text-primary);
}

.watt-description {
  color: var(--text-secondary);
  line-height: 1.6;
}

.watt-actions {
  display: flex;
  gap: var(--space-md);
  justify-content: flex-end;
}

/* Auto Save Indicator */
.auto-save-indicator {
  position: fixed;
  bottom: var(--space-xl);
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--success);
  color: white;
  padding: var(--space-md) var(--space-lg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  transition: var(--transition-normal);
  opacity: 0;
}

.auto-save-indicator.visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Ripple Effect */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  transform: scale(0);
  animation: ripple 0.6s linear;
  pointer-events: none;
}

@keyframes ripple {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

/* Animations */
.animate-slide {
  animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.delay-100 { animation-delay: 0.1s; }
.delay-200 { animation-delay: 0.2s; }
.delay-300 { animation-delay: 0.3s; }
.delay-400 { animation-delay: 0.4s; }
.delay-500 { animation-delay: 0.5s; }

/* Empty States */
.empty-state {
  text-align: center;
  padding: var(--space-2xl);
  color: var(--text-muted);
}

.empty-state-icon {
  margin-bottom: var(--space-lg);
}

.empty-state-icon .material-icons {
  font-size: 4rem;
  color: var(--text-muted);
}

.empty-state-title {
  font-size: var(--font-size-xl);
  font-weight: 600;
  margin-bottom: var(--space-md);
  color: var(--text-primary);
}

.empty-state-description {
  font-size: var(--font-size-base);
  margin-bottom: var(--space-xl);
  line-height: 1.6;
}

/* Utility Classes */
.desktop-only {
  display: inline;
}

.mobile-only {
  display: none;
}

.haptic-link {
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* Responsive Design */
@media (max-width: 768px) {
  .header {
    padding: var(--space-md);
  }
  
  .main-content {
    padding: var(--space-md);
  }
  
  .dashboard-grid {
    grid-template-columns: 1fr;
    gap: var(--space-md);
  }
  
  .editor-content-container {
    flex-direction: column;
    padding: var(--space-md);
  }
  
  .editor-analytics {
    width: 100%;
    order: 2;
  }
  
  .editor-content {
    order: 1;
  }
  
  .editor-analytics.collapsed {
    display: none;
  }
  
  .history-content {
    grid-template-columns: 1fr;
    gap: var(--space-lg);
  }
  
  .stats-grid {
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  
  .editor-header {
    padding: var(--space-md);
  }
  
  .editor-actions {
    gap: var(--space-xs);
  }
  
  .desktop-only {
    display: none;
  }
  
  .mobile-only {
    display: inline;
  }
  
  .fab {
    bottom: var(--space-lg);
    right: var(--space-lg);
  }
  
  .search-results-grid {
    grid-template-columns: 1fr;
  }
  
  .modal-content {
    width: 95%;
    margin: var(--space-md);
  }
  
  .modal-actions {
    flex-direction: column;
  }
  
  .watt-actions {
    flex-direction: column;
  }
}

@media (max-width: 480px) {
  :root {
    --space-lg: 1rem;
    --space-xl: 1.5rem;
    --space-2xl: 2rem;
  }
  
  .drawer {
    width: 280px;
  }
  
  .editor-title {
    font-size: var(--font-size-xl);
  }
  
  .stats-grid {
    grid-template-columns: 1fr;
  }
  
  .history-graph {
    height: 150px;
  }
}

/* Print Styles */
@media print {
  .header,
  .fab,
  .editor-header,
  .editor-footer,
  .drawer {
    display: none !important;
  }
  
  .main-content {
    padding: 0;
  }
  
  .editor-container {
    position: static;
    transform: none;
  }
  
  .editor-content-container {
    padding: 0;
  }
  
  .editor-analytics {
    display: none;
  }
  
  .editor-content {
    border: none;
    box-shadow: none;
    padding: 0;
  }
}

/* High Contrast Mode Support */
@media (prefers-contrast: high) {
  :root {
    --border: #000000;
    --border-light: #333333;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.8);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.8), 0 2px 4px -1px rgba(0, 0, 0, 0.6);
  }
  
  .glass {
    background: var(--surface);
    border: 2px solid var(--border);
  }
}

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  
  .ripple {
    animation: none;
  }
  
  .animate-slide {
    animation: none;
  }
}

<script>

document.addEventListener('DOMContentLoaded', function() {
  if (!('vibrate' in navigator)) return;

  const hapticLinks = document.querySelectorAll('.haptic-link');
  if (!hapticLinks.length) return;

  const vibrate = () => {
    try {
      navigator.vibrate([15, 3, 15]);
    } catch (e) {
      console.warn('Haptic feedback unavailable');
    }
  };

  hapticLinks.forEach(link => {

    link.addEventListener('touchstart', vibrate, { passive: true });

    // Mouse clicks
    link.addEventListener('mousedown', vibrate);

    // For click events (delayed slightly to not block navigation)
    link.addEventListener('click', (e) => {
      if (e.screenX !== 0) { // Filter out synthetic clicks
        setTimeout(vibrate, 10);
      }
    });

    // For long press (contextmenu)
    link.addEventListener('contextmenu', vibrate);
  });

  // Optional: Prevent vibration on scroll
  let lastTouchTime = 0;
  document.addEventListener('touchmove', () => {
    lastTouchTime = Date.now();
  }, { passive: true });
});
</script>

    <script>
        // PWA Installation Manager
        class PWAInstaller {
            constructor() {
                this.deferredPrompt = null;
                this.bottomSheet = null;
                this.hasShownPrompt = localStorage.getItem('pwaPromptShown') === 'true';
                this.init();
            }

            init() {
                // Check if running on HTTPS (required for PWA installation)
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                    console.warn('PWA installation requires HTTPS');
                    return;
                }

                // Event listeners
                window.addEventListener('beforeinstallprompt', this.handleInstallPrompt.bind(this));
                window.addEventListener('appinstalled', this.handleAppInstalled.bind(this));
                document.addEventListener('DOMContentLoaded', this.checkPWAStatus.bind(this));

                // Register Service Worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js')
                        .then(reg => console.log('Service Worker registered:', reg))
                        .catch(err => console.error('Service Worker registration failed:', err));
                } else {
                    console.warn('Service Worker not supported in this browser');
                }
            }

            handleInstallPrompt(e) {
                e.preventDefault();
                this.deferredPrompt = e;

                // Show bottom sheet only if not already installed and not dismissed
                if (!this.isRunningAsPWA() && !this.hasShownPrompt) {
                    this.showBottomSheet();
                }
            }

            handleAppInstalled() {
                console.log('PWA successfully installed');
                this.hideBottomSheet();
                localStorage.setItem('pwaPromptShown', 'true');
                this.deferredPrompt = null;
            }

            showBottomSheet() {
                if (this.bottomSheet) return;

                // Create bottom sheet
                this.bottomSheet = document.createElement('div');
                this.bottomSheet.id = 'pwaBottomSheet';
                this.bottomSheet.className = 'pwa-bottom-sheet';
                this.bottomSheet.setAttribute('role', 'dialog');
                this.bottomSheet.setAttribute('aria-label', 'Install App Prompt');
                this.bottomSheet.innerHTML = `
                    <div class="pwa-bottom-sheet-content">
                        <h2>Install Our App</h2>
                        <p>Enjoy a better experience by adding our app to your home screen.</p>
                        ${this.isIOS() ? `
                            <p class="ios-instructions">
                                To install, tap the <span class="material-icons">ios_share</span> Share button in Safari and select <strong>Add to Home Screen</strong>.
                            </p>
                        ` : ''}
                        <div class="pwa-bottom-sheet-actions">
                            ${!this.isIOS() ? `
                                <button id="installButton" class="pwa-install-btn">
                                    <span class="material-icons">download</span>
                                    Install App
                                </button>
                            ` : ''}
                            <button id="notNowButton" class="pwa-not-now-btn">Not Now</button>
                        </div>
                    </div>
                `;

                document.body.appendChild(this.bottomSheet);

                // Add event listeners for buttons
                if (!this.isIOS()) {
                    const installButton = this.bottomSheet.querySelector('#installButton');
                    installButton.addEventListener('click', this.triggerInstall.bind(this));
                    installButton.focus(); // Auto-focus for accessibility
                }

                const notNowButton = this.bottomSheet.querySelector('#notNowButton');
                notNowButton.addEventListener('click', this.handleNotNow.bind(this));

                // Add keyboard navigation
                this.addKeyboardNavigation();
            }

            async triggerInstall() {
                if (!this.deferredPrompt) return;

                try {
                    const installButton = this.bottomSheet.querySelector('#installButton');
                    installButton.disabled = true;
                    this.deferredPrompt.prompt();

                    const {
                        outcome
                    } = await this.deferredPrompt.userChoice;
                    console.log(`User ${outcome} the install prompt`);
                } catch (err) {
                    console.error('Error during PWA installation:', err);
                } finally {
                    this.deferredPrompt = null;
                    this.hideBottomSheet();
                }
            }

            handleNotNow() {
                localStorage.setItem('pwaPromptShown', 'true');
                this.hasShownPrompt = true;
                this.hideBottomSheet();
            }

            hideBottomSheet() {
                if (this.bottomSheet) {
                    this.bottomSheet.classList.add('hide');
                    setTimeout(() => {
                        this.bottomSheet.remove();
                        this.bottomSheet = null;
                    }, 300); // Match CSS transition duration
                }
            }

            isRunningAsPWA() {
                return window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;
            }

            isIOS() {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            }

            checkPWAStatus() {
                if (this.isRunningAsPWA()) {
                    console.log('App is running in standalone mode');
                    localStorage.setItem('pwaPromptShown', 'true');
                    this.hasShownPrompt = true;
                } else if (!this.hasShownPrompt && !this.isIOS()) {
                    // Wait a moment to ensure beforeinstallprompt has a chance to fire
                    setTimeout(() => {
                        if (this.deferredPrompt) {
                            this.showBottomSheet();
                        }
                    }, 1000);
                }
            }

            addKeyboardNavigation() {
                this.bottomSheet.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.handleNotNow();
                    }
                });
            }

            destroy() {
                // Cleanup event listeners
                window.removeEventListener('beforeinstallprompt', this.handleInstallPrompt.bind(this));
                window.removeEventListener('appinstalled', this.handleAppInstalled.bind(this));
                document.removeEventListener('DOMContentLoaded', this.checkPWAStatus.bind(this));
                this.hideBottomSheet();
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            const installer = new PWAInstaller();

            // Optional: Cleanup on page unload
            window.addEventListener('unload', () => {
                installer.destroy();
            });
        });
    </script>

<script>
    // Main App Class
    class CountifyApp {
        constructor() {
            this.state = {
                activities: [],
                currentActivityId: null,
                isEditing: false,
                pendingAction: null,
                activeView: 'dashboard',
                searchQuery: '',
                selectedFolder: 'all',
                theme: 'system',
                font: 'Poppins',
                textSize: 'normal',
                isSearching: false,
                showSearchResults: false,
                wattConsent: localStorage.getItem('watt-consent') === 'true',
                wattAsked: localStorage.getItem('watt-asked') === 'true',
                voiceRecognition: null,
                isVoiceModeActive: false,
                isVoiceListening: false,
                historyStack: {},
                futureStack: {},
                lastSaveTime: null,
                autoSaveInterval: null,
                visualizerInterval: null,
                sharedText: null,
                isFullscreenSearch: false
            };

            this.views = ['dashboard', 'today', 'yesterday', 'deleted', 'archived', 'history'];

            this.init();
        }

        async init() {
            this.renderAppShell();
            this.setupEventListeners();
            await this.loadSettings();
            await this.loadActivities();
            this.renderView();
            this.watchSystemTheme();
            this.setupRippleEffects();
            this.checkForSharedText();

            if (!this.state.wattAsked) {
                setTimeout(() => this.showWATTBanner(), 2000);
            }

            this.registerServiceWorker();
            this.initializeHistoryStack();
            this.startAutoSave();
        }

        checkForSharedText() {
            // Check URL parameters for shared text
            const urlParams = new URLSearchParams(window.location.search);
            const sharedText = urlParams.get('sharedText');

            if (sharedText) {
                this.state.sharedText = decodeURIComponent(sharedText);
                this.openEditorWithSharedText();

                // Clean URL
                const newUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, document.title, newUrl);
            }

            // Check for clipboard content on app start
            this.checkClipboardContent();
        }

        async checkClipboardContent() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const clipboardText = await navigator.clipboard.readText();
                    if (clipboardText && clipboardText.trim().length > 10) {
                        // Show a prompt asking if user wants to create activity from clipboard
                        setTimeout(() => {
                            this.showConfirmModal(
                                'Clipboard Content Detected',
                                'Would you like to create a new activity from your clipboard content?',
                                () => {
                                    this.state.sharedText = clipboardText;
                                    this.openEditorWithSharedText();
                                }
                            );
                        }, 1000);
                    }
                }
            } catch (error) {
                // Clipboard access might be denied, ignore
                console.log('Clipboard access not available');
            }
        }

        openEditorWithSharedText() {
            if (!this.state.sharedText) return;

            this.openEditor();
            setTimeout(() => {
                const editor = document.getElementById('editorContent');
                if (editor) {
                    editor.value = this.state.sharedText;
                    this.updateTextAnalytics();
                    this.pushToHistoryStack();

                    // Set title based on shared text
                    const titleInput = document.getElementById('editorTitle');
                    const firstLine = this.state.sharedText.split('\n')[0].substring(0, 50);
                    if (titleInput && firstLine.trim()) {
                        titleInput.value = firstLine + (firstLine.length === 50 ? '...' : '');
                    }
                }
            }, 100);
        }

        initializeHistoryStack() {
            this.state.historyStack = {};
            this.state.futureStack = {};
        }

        startAutoSave() {
            if (this.state.autoSaveInterval) {
                clearInterval(this.state.autoSaveInterval);
            }

            this.state.autoSaveInterval = setInterval(() => {
                if (this.state.currentActivityId && document.getElementById('editorContent')) {
                    this.saveActivity(true);
                }
            }, 3000); // Reduced to 3 seconds for better auto-save
        }

        showAutoSaveIndicator() {
            const indicator = document.getElementById('autoSaveIndicator');
            if (!indicator) return;

            indicator.classList.add('visible');
            setTimeout(() => {
                indicator.classList.remove('visible');
            }, 2000);
        }

        registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').then(registration => {
                        console.log('ServiceWorker registration successful');
                    }).catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });
            }
        }

                        Countify+
                    </h1>
                    <div class="header-actions">
                        <button id="searchToggle" class="btn btn-icon haptic-link" aria-label="Search">
                            <span class="material-icons">search</span>
                        </button>
                        <button id="newActivityBtn" class="btn btn-primary haptic-link">
                            <span class="material-icons">add</span>
                            <span class="desktop-only">New</span>
                        </button>
                    </div>
                </header>

                <div class="layout-container">
                    <div id="drawerOverlay" class="drawer-overlay"></div>
                    <aside id="drawer" class="drawer">
                        ${this.renderDrawerContent()}
                    </aside>
                    <main class="main-content" id="mainContent">
                    </main>
                </div>

                <!-- Fullscreen Search -->
                <div id="fullscreenSearch" class="fullscreen-search">
                    <div class="search-header">
                        <button id="searchBack" class="btn btn-icon">
                            <span class="material-icons">arrow_back</span>
                        </button>
                        <div class="search-input-container">
                            <span class="material-icons">search</span>
                            <input type="text" id="fullscreenSearchInput" placeholder="Search activities...">
                            <button id="clearSearch" class="btn btn-icon">
                                <span class="material-icons">clear</span>
                            </button>
                        </div>
                    </div>
                    <div class="search-results-section">
                        <h3 class="search-section-title">Search Results</h3>
                        <div id="fullscreenSearchResults" class="search-results-grid">
                        </div>
                    </div>
                </div>

                <div id="editorContainer" class="editor-container">
                    ${this.renderEditorContent()}
                </div>
                <div id="confirmModal" class="modal">
                    ${this.renderModal('confirm')}
                </div>

                <div id="alertModal" class="modal">

                <div id="editorOptionsMenu" class="editor-options-menu">
                    ${this.renderEditorOptionsMenu()}
                </div>
                <button id="fab" class="fab haptic-link" aria-label="Create new activity" style="border: none;">
                    <span class="material-icons">add</span>
                </button>

                <div id="wattBanner" class="watt-banner">
                    <div class="watt-content">
                        <div class="watt-title">Privacy & Tracking</div>  
                        <div class="watt-description">
                            Countify+ processes your writing and voice locally on your device...
                        </div>
                    </div>
